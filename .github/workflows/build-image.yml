name: Build UUSIVC2026 Docker Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (public repo)
        uses: actions/checkout@v4
        with:
          ref: baseline-0.6505

      - name: Checkout weights (private repo)
        uses: actions/checkout@v4
        with:
          repository: Dawn596-ux/UUSIVC-2026-weights
          token: ${{ secrets.WEIGHTS_PAT }}
          lfs: true
          path: weights

      - name: Build image
        run: |
          docker build -t uusivc2026:baseline -f docker/Dockerfile .
          docker images | grep -E 'uusivc2026|pytorch'

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push to Docker Hub
        run: |
          docker tag uusivc2026:baseline dawnux/uusivc2026:baseline
          docker push dawnux/uusivc2026:baseline
